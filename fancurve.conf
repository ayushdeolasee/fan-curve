# fancurve.conf — edit this file to tune the fan curve.
# The daemon re-reads it automatically (checks every cycle), no restart needed.
# If you make a syntax error, the daemon keeps the last good config and logs a warning.

# ── The curve ────────────────────────────────────────────────────────────────
# Comma-separated  temp°C:fan%  points. Linear interpolation between points.
# Below the first point → first point's %. Above the last → 100%.
# 0%   = fan minimum (~1500 RPM on this machine — same as macOS at idle, inaudible)
# 100% = fan maximum (5348 / 5776 RPM — loud)
# Rough loudness on the 16" M1 Max: ≤2200 RPM near-silent, ~3000 soft hum,
# ~3800 clearly audible, 4500+ loud.
#
# macOS stock behavior ≈ stays at minimum until ~95°C, then ramps hard.
# This default starts cooling much earlier so the chip throttles less,
# while staying in the "soft hum" range for typical sustained loads.
curve = 55:0, 65:20, 75:40, 85:65, 95:100

# ── Which temperature drives the curve ───────────────────────────────────────
# cpu | gpu | max   (max = hotter of the two; recommended)
temp_source = max

# ── Behavior tuning ──────────────────────────────────────────────────────────
# Seconds between temperature checks.
poll_interval = 5

# Ignore target changes smaller than this many RPM (prevents constant tiny
# adjustments / oscillation around a curve point).
deadband_rpm = 100

# Fans speed UP instantly, but spin DOWN at most this many %-points per cycle.
# Keeps fans from yo-yoing when a load spike ends. 5%/cycle @ 5s poll means a
# full 100→0 spin-down takes ~100 s.
step_down_pct = 5

# At or above this temperature, both fans go to 100% immediately, curve ignored.
failsafe_temp = 100
